name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: tools/env/node-version.txt
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Spec — exemples valides / invalides
        working-directory: .
        run: |
          pip install -r tools/env/requirements.txt
          python spec/v0/validate.py

      - name: Dépendances
        run: npm ci

      - name: Tests unitaires
        run: npm test

      - name: Navigateur (Google Chrome, pour le H.264)
        run: npx playwright install --with-deps chrome

      - name: Tests navigateur (build de production)
        run: npm run e2e

      - name: Rapport des tests navigateur
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/playwright-report/
            app/test-results/
          retention-days: 7
